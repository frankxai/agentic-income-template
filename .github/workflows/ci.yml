name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `next lint` was removed in Next.js 16 (the lint script is a no-op/failure
      # in this stack), so lint is reported but non-blocking. Build is the gate.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build
